# English re-draw of the Chinese text baked into client images (stage 1).
# Read by localise/images.py; see its docstring for every key.
# Boxes are [x0, y0, x1, y1] in image pixels, x1/y1 exclusive.
# English comes from the localise glossary/cache where the word exists there;
# the rest is translated here, short game-UI style. Keep `zh` exactly as drawn.

# --- presets ----------------------------------------------------------------------

[preset.mainbtn]
# White label with a dark outline drawn over the icon art: only the white
# glyphs (and their outline) are filled in, the art between them stays.
group = "main-city-buttons"
mode = "inpaint"
mask = "light"
light = 205
grow = 5
fill = ["#ffffff", "#e8e8e8"]
outline = "#2a1608"
stroke = 0.16
lines = 2

